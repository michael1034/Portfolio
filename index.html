<!DOCTYPE html>
<html lang="en">

<head>
  <title>My First Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Welcome to my Portfolio</h1>
  <h2>Notre Dame of Dadiangas University</h2>

  <div class="profile">
    <img src="images/images.jpg" alt="Image of Michael">
    <div class="info">
      <p class="username">Michael Francis G. Virgo</p>
      <p>BS Computer Science - First Year</p>
      <p>Are you Kassy?</p>
    </div>
  </div>
<div class="question">
  <p id="question-text">Do you still want us to continue?</p>
  <button onclick="sayYes()">Yes</button>
  <button id="no-btn" onmouseover="moveButton()">No</button>
</div>

<script>
let yesCount = 0;

function sayYes() {
  yesCount++;
  const questionText = document.getElementById("question-text");

  if (yesCount === 1) {
    questionText.innerText = "Will you try it out again with me?";
  } else if (yesCount === 2) {
    questionText.innerText = "aweee thankyou baby:( miss you so much my baby ko :(";
  }
}

function moveButton() {
  const btn = document.getElementById("no-btn");
  const maxX = window.innerWidth - btn.offsetWidth;
  const maxY = window.innerHeight - btn.offsetHeight;

  const randomX = Math.random() * maxX;
  const randomY = Math.random() * maxY;

  btn.style.position = "fixed";
  btn.style.left = randomX + "px";
  btn.style.top = randomY + "px";
}
</script>
